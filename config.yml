meta:
  task: "finetune"
  data_mode: "mixed"
  seed: 8888
  cuda: 0

arch:
  in_dim: 200
  num_classes: 9
  d_model: 200
  dim_feedforward: 800
  seq_len: 10
  n_layer: 12
  nhead: 8

training:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.05
  clip_value: 1.0
  lr_scheduler: "CosineAnnealingLR"
  pretrained_weights: "./models_weights/CBraMod_Pretrain/epoch991_loss4.078252686667838e-07.pth"
  diffusion_weights: "" # Path to the trained diffusion model for generating data
  synthetic_ratio: 1
  cfg_scale: 4.0
paths:
  model_dir: "./models_weights/CBraMod_Finetuned"
  datasets_dir: "./datasets/real_data_lmdb"
  synthetic_data_dir: "./datasets/synthetic_data"